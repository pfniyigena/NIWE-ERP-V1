<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/main}">
<head>
<title th:text="#{label.dashboard.inventory}"></title>
</head>
<div layout:fragment="content">
	<div class="ecommerce-widget">
		<div class="row">
			<!-- ============================================================== -->
			<!-- Stock Value -->
			<!-- ============================================================== -->
			<div class="col-xl-6 col-lg-3 col-md-6 col-sm-12 col-12">
				<div class="card border-3 border-top border-top-primary">
					<div class="card-body">
						<h5 class="text-muted">STOCK VALUES</h5>
						<div class="metric-value d-inline-block">
							<h4 class="mb-1"
								th:text=" 'RWF' + ${#numbers.formatDecimal(stockValue, 1, 'COMMA', 2, 'POINT')}">
								RWF0.00</h4>
						</div>
						<div
							class="metric-label d-inline-block float-right text-success font-weight-bold">
							<span
								class="icon-circle-small icon-box-xs text-success bg-success-light"><i
								class="fa fa-fw fa-arrow-up"></i></span><span class="ml-1">Stock</span>
						</div>
					</div>
				</div>
			</div>
			<!-- ============================================================== -->
			<!-- end Stock Value - -->
			<!-- ============================================================== -->
			<!-- ============================================================== -->
			<!-- stand value  -->
			<!-- ============================================================== -->
			<div class="col-xl-6 col-lg-3 col-md-6 col-sm-12 col-12">
				<div class="card border-3 border-top border-top-primary">
					<div class="card-body">
						<h5 class="text-muted">STAND VALUE</h5>
						<div class="metric-value d-inline-block">
							<h4 class="mb-1"
								th:text="'RWF' + ${#numbers.formatDecimal(standValue, 1, 'COMMA', 2, 'POINT')}">RWF0.00</h4>
						</div>
						<div
							class="metric-label d-inline-block float-right text-success font-weight-bold">
							<span
								class="icon-circle-small icon-box-xs text-success bg-success-light"><i
								class="fa fa-fw fa-arrow-up"></i></span><span class="ml-1">Stand</span>
						</div>
					</div>
				</div>
			</div>
			<!-- ============================================================== -->
			<!-- end stand value   -->
			<!-- ============================================================== -->
		</div>
		<div class="row">
			<!-- ============================================================== -->
			<!-- ============================================================== -->
			<!-- Reorder  -->
			<!-- ============================================================== -->
			<div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
				<div class="card">
					<h5 class="card-header">Low Stock Reorder System</h5>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table id="reordersTable"
								class="table table-striped table-bordered first">
								<thead>
									<tr>
										<th>#</th>
										<th th:text="#{label.general.name}"></th>
										<th th:text="#{label.general.quantity}"></th>
										<th th:text="#{label.stock.level}"></th>
									</tr>
								</thead>
								<tbody>

								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
			<!-- ============================================================== -->
			<!-- end Reorder  -->
		</div>
		<div class="row">
			<!-- ============================================================== -->
			<!-- ============================================================== -->
			<!-- Stock by Category  -->
			<!-- ============================================================== -->
			<div class="col-xl-6 col-lg-12 col-md-6 col-sm-12 col-12">
				<div class="card">
					<h5 class="card-header">Stock by Category</h5>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table class="table table-striped table-bordered first">
								<thead class="bg-light">
									<tr class="border-0">
										<th class="border-0">#</th>
										<th class="border-0">Category</th>
										<th class="border-0">Quantity</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="list,stat : ${categories}">
										<td th:text="${stat.index + 1}"></td>
										<td th:text="${list.itemName}"></td>
										<td th:text="${list.quantity}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
			<!-- ============================================================== -->
			<!-- End Stock by Category-->
			<!-- ============================================================== -->
			<!-- ============================================================== -->
			<!-- Stock by Brand  -->
			<!-- ============================================================== -->
			<div class="col-xl-6 col-lg-12 col-md-6 col-sm-12 col-12">
				<div class="card">
					<h5 class="card-header">Stock by Brand</h5>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table class="table table-striped table-bordered first">
								<thead class="bg-light">
									<tr class="border-0">
										<th class="border-0">#</th>
										<th class="border-0">Brand</th>
										<th class="border-0">Quantity</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="list,stat : ${brands}">
										<td th:text="${stat.index + 1}"></td>
										<td th:text="${list.itemName}"></td>
										<td th:text="${list.quantity}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
			<!-- ============================================================== -->
			<!-- end Stock by Brand -->
			<!-- ============================================================== -->
		</div>
		<div class="row">
			<!-- ============================================================== -->
			<!-- ============================================================== -->
			<!-- Inflow vs Outflow  -->
			<!-- ============================================================== -->
			<div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
				<div class="card">
					<h5 class="card-header">Inflow vs Outflow</h5>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table class="table table-striped table-bordered first">
								<thead class="bg-light">
									<tr class="border-0">
										<th class="border-0">#</th>
										<th class="border-0">Day</th>
										<th class="border-0">Inflow</th>
										<th class="border-0">Outflow</th>
										<th class="border-0">Sale</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="list,stat : ${histories}">
										<td th:text="${stat.index + 1}"></td>
										<td th:text="${list.day}"></td>
										<td th:text="${list.inflow}"></td>
										<td th:text="${list.outflow}"></td>
										<td th:text="${list.sale}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
			<!-- ============================================================== -->
			<!-- end Inflow vs Outflow  -->
		</div>
	</div>
</div>
<div layout:fragment="page-scripts">
	<script>
		// URL for first table
		const INFLOWS_DATA_URL = BASE_URL + "inflows/reorder/list/data";
	</script>
	<script th:src="@{/assets/niwe/js/reorder-tables.js}"></script>
</div>
</html>

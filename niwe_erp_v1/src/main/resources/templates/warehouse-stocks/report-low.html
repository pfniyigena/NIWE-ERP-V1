<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/main}">
<head>
<title th:text="#{menu.report.stock.low}"></title>
</head>
<div layout:fragment="content">
	<div class="row">
		<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
			<div class="page-breadcrumb">
				<nav aria-label="breadcrumb">
					<ol class="breadcrumb">
						<li class="breadcrumb-item"><span th:text="#{menu.inventory}"></span></li>
						<li class="breadcrumb-item"><span th:text="#{menu.reports}"></span></li>
						<li class="breadcrumb-item"><a href="#"
							th:href="@{/stock-movements/report}" class="breadcrumb-link"><span
								th:text="#{menu.report.stock.movements}"></span></a></li>
						<li class="breadcrumb-item"><a href="#"
							th:href="@{/warehouse-stocks/report}"> <span
								th:text="#{menu.report.stock.status}"></span></a></li>
						<li class="breadcrumb-item active" aria-current="page"><span
							th:text="#{menu.report.stock.low}"></span></li>
					</ol>
				</nav>
			</div>

		</div>
	</div>
	<!-- ============================================================== -->
	<!-- end pageheader -->
	<!-- ============================================================== -->
	<div class="row">
		<!-- ============================================================== -->
		<!-- users table  -->
		<!-- ============================================================== -->
		<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
			<div class="card">
				<div class="card-header d-flex">
					<h5 th:text="#{menu.report.stock.low}"></h5>
					<div class="toolbar ml-auto">
						<div class="form-inline align-items-center mr-2">
							<div class="input-group input-group-sm">
								<label th:text="#{label.general.category}" for="category"></label><select
									id="categoryId" name="categoryId" class="selectpicker"
									style="width: 280px !important; min-width: 100px; max-width: 400px; flex: none !important;">
									<option value="">-- Select --</option>
									<option th:each="it : ${categories}" th:value="${it.id}"
										th:text="${it.categoryName}"></option>
								</select> <label th:text="#{label.general.brand}" for="brand"></label> <select
									class="selectpicker" id="brandId" name="brandId"
									style="width: 280px !important; min-width: 100px; max-width: 400px; flex: none !important;">
									<option value="">-- Select --</option>
									<option th:each="it : ${brands}" th:value="${it.id}"
										th:text="${it.brandName}"></option>
								</select>
								<div class="input-group-append">
									<!-- Search Button -->
									<button id="filterBtn"
										class="btn btn-primary  d-inline-flex align-items-center justify-content-center"
										style="height: 40px; width: 40px; padding: 0;"
										th:title="#{label.button.search}">
										<i class="fa fa-search"></i>
									</button>

									<!-- Reset Button -->
									<a th:href="@{/warehouse-stocks/report}"
										class="btn btn-secondary d-inline-flex align-items-center justify-content-center"
										style="height: 40px; width: 40px; padding: 0; margin-left: 2px;"
										th:title="#{label.button.reset}"> <i class="fa fa-times"></i>
									</a>

								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="card-body">
					<div class="table-responsive">
						<table id="warehouseStockReport"
							class="table table-striped table-bordered first">
							<thead>
								<tr>
									<th>#</th>
									<th th:text="#{label.general.name}"></th>
									<th th:text="#{label.general.current.quantity}"></th>
									<th th:text="#{label.general.purchase.price}"></th>
									<th th:text="#{label.general.sale.price}"></th>
									<th th:text="#{label.stock.level}"></th>
									<th th:text="#{label.general.category}"></th>
									<th th:text="#{label.general.brand}"></th>
								</tr>
							</thead>
							<tbody>

							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
		<!-- ============================================================== -->
		<!-- end users table  -->
		<!-- ============================================================== -->
	</div>
</div>
<div layout:fragment="page-scripts">
	<script th:src="@{/assets/niwe/js/warehouse-stock-report-low.js}"></script>
</div>
</html>
